name: Apply community review fixes

on:
  push:
    branches:
      - main
    paths:
      - "scripts/apply-community-review-fixes.mjs"
      - ".github/workflows/apply-community-review-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply fixes
        run: node scripts/apply-community-review-fixes.mjs

      - name: Verify
        run: npm run check

      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests styles.css manifest.json package.json package-lock.json versions.json
          git commit -m "fix: pass Obsidian community review checks"
          git push
