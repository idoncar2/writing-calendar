name: Apply bilingual UI v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-i18n-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild i18n patch
        shell: bash
        run: |
          cat .github/i18n-payload/{0,1,2,3,4,5} > /tmp/payload
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          payload = Path('/tmp/payload').read_text(encoding='utf-8')
          assert len(payload) == 20864, len(payload)
          assert hashlib.sha256(payload.encode()).hexdigest() == 'd1b86135a3f442eaff557fa3863f2668cc562161f3e4b79a05949fd5c6c66943'
          Path('/tmp/apply-i18n.mjs').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          node /tmp/apply-i18n.mjs
      - name: Verify
        run: npm run check
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests manifest.json package.json package-lock.json versions.json
          git commit -m "feat: add English interface"
          git push
