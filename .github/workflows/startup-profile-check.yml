name: Startup profiling checks

on:
  push:
    branches:
      - diagnostics/startup-baseline-20261017
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and build
        run: npm run check
      - name: Assemble test installation
        run: |
          mkdir -p writing-calendar
          cp main.js manifest.json styles.css writing-calendar/
      - name: Upload safe test build
        uses: actions/upload-artifact@v4
        with:
          name: writing-calendar-diagnostics-test
          path: writing-calendar/
          retention-days: 14
