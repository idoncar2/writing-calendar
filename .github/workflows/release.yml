name: Release Obsidian plugin

on:
  push:
    branches:
      - main
    paths:
      - "manifest.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "styles.css"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm run check

      - name: Read manifest version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [[ -z "$VERSION" || "$VERSION" == v* ]]; then
            echo "Invalid manifest version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; nothing to do."
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
          fi

          gh release create "$VERSION" \
            main.js \
            manifest.json \
            styles.css \
            --title "$VERSION" \
            --notes "Writing Calendar $VERSION"
