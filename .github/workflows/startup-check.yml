name: Startup performance checks

on:
  push:
    branches:
      - "perf/nonblocking-startup-20261017"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests and compile
        run: npm run check
      - name: Prepare Obsidian mobile test package
        run: |
          mkdir -p writing-calendar
          cp main.js manifest.json styles.css writing-calendar/
      - name: Upload installable test package
        uses: actions/upload-artifact@v4
        with:
          name: writing-calendar-startup-test
          path: writing-calendar/
          retention-days: 14
